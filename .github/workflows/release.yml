name: '发布新版本'

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - name: 创建 Release 草稿
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `${context.ref.replace('refs/tags/', '')}`,
              name: `SkillHub ${context.ref.replace('refs/tags/', '')}`,
              body: '安装包正在构建中，请稍候...',
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        run: npm install

      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    steps:
      - uses: actions/checkout@v4
      
      - name: 为国内网络优化 latest.json 下载链路并发布 Release
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const releaseId = Number(process.env.release_id);

            let releaseNotes = '';
            try {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
              const version = context.ref.replace('refs/tags/v', '');
              // 匹配当前版本的更新日志，直到下一个版本标题 (## [) 或文件结束
              const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`## \\[${escapedVersion}\\][^\\n]*\\n(.*?)(?=\\n## \\[|$)`, 's');
              const match = changelog.match(regex);
              if (match && match[1]) {
                releaseNotes = match[1].trim();
              }
            } catch (err) {
              console.log('读取 CHANGELOG.md 失败或无匹配版本日志', err);
            }

            // 自动改写 latest.json 中的安装包下载链接为国内高速镜像，并注入版本更新日志到 notes 字段
            try {
              const { data: assets } = await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                per_page: 50
              });
              const latestAsset = assets.find(a => a.name === 'latest.json');
              if (latestAsset) {
                const dl = await github.rest.repos.getReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: latestAsset.id,
                  headers: { accept: 'application/octet-stream' }
                });
                const rawJson = Buffer.from(dl.data).toString('utf8');
                const parsed = JSON.parse(rawJson);
                if (parsed.platforms) {
                  for (const key of Object.keys(parsed.platforms)) {
                    const entry = parsed.platforms[key];
                    if (entry && typeof entry.url === 'string' && entry.url.startsWith('https://github.com/')) {
                      entry.url = `https://gh-proxy.com/${entry.url}`;
                    }
                  }
                }
                if (releaseNotes) {
                  parsed.notes = releaseNotes;
                } else if (typeof parsed.notes === 'string' && parsed.notes.includes('安装包正在构建中')) {
                  parsed.notes = '';
                }
                const updatedJson = JSON.stringify(parsed, null, 2);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: latestAsset.id
                });
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: releaseId,
                  name: 'latest.json',
                  data: updatedJson
                });
              }
            } catch (err) {
              console.log('重写 latest.json 镜像链接时出错，保留原文件:', err);
            }

            const body = releaseNotes 
              ? `${releaseNotes}\n\n---\n\n## 下载安装\n\n请根据你的操作系统选择对应的安装包：\n\n| 平台 | 安装包 |\n|------|--------|\n| macOS (Intel + Apple Silicon) | \`.dmg\` |\n| Windows (x64) | \`.exe\` 或 \`.msi\` |\n| Linux (x64) | \`.AppImage\` 或 \`.deb\` |\n\n> 已安装旧版本的用户会在应用内收到更新提示。`
              : `## 下载安装\n\n请根据你的操作系统选择对应的安装包：\n\n| 平台 | 安装包 |\n|------|--------|\n| macOS (Intel + Apple Silicon) | \`.dmg\` |\n| Windows (x64) | \`.exe\` 或 \`.msi\` |\n| Linux (x64) | \`.AppImage\` 或 \`.deb\` |\n\n> 已安装旧版本的用户会在应用内收到更新提示。`;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false,
              body: body
            });
